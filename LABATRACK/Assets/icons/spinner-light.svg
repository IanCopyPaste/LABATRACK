<!-- LabaTrack loading spinner (white, for blue and red buttons). Drawn for this project; it is a background image, so it cannot take the text colour. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round">
  <circle cx="12" cy="12" r="9" stroke-opacity=".3"/>
  <path d="M21 12a9 9 0 0 0-9-9">
    <animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="0.8s" repeatCount="indefinite"/>
  </path>
</svg>
